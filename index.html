<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>Zashi Store - Luxury Jewelry Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
      color: #fff;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Hero Section */
    .hero {
      min-height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                  url('https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=1920') center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 20px;
      animation: fadeIn 1.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .hero-content {
      max-width: 800px;
      animation: slideUp 1s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5em, 8vw, 4em);
      color: #d4af37;
      margin-bottom: 20px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
      line-height: 1.2;
    }

    .hero p {
      font-size: clamp(1em, 3vw, 1.3em);
      color: #f0f0f0;
      margin-bottom: 30px;
      font-weight: 300;
      padding: 0 10px;
    }

    .hero-btn {
      background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
      color: #000;
      padding: 16px 45px;
      border: none;
      border-radius: 50px;
      font-size: clamp(1em, 2.5vw, 1.1em);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      min-height: 50px;
      touch-action: manipulation;
    }

    .hero-btn:hover, .hero-btn:active {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
    }

    /* Products Section */
    .products-section {
      padding: 60px 15px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2em, 6vw, 3em);
      text-align: center;
      color: #d4af37;
      margin-bottom: 50px;
      position: relative;
    }

    .section-title::after {
      content: '';
      display: block;
      width: 80px;
      height: 3px;
      background: #d4af37;
      margin: 20px auto 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    .card {
      background: linear-gradient(145deg, #1a1a1a 0%, #2a2a2a 100%);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      transition: all 0.4s ease;
      border: 1px solid rgba(212, 175, 55, 0.2);
      animation: fadeInUp 0.6s ease-out;
    }

    @keyframes fadeInUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 25px 60px rgba(212, 175, 55, 0.3);
      border-color: rgba(212, 175, 55, 0.5);
    }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .card:hover img {
      transform: scale(1.05);
    }

    .card-body {
      padding: 25px;
      text-align: center;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.3em, 4vw, 1.6em);
      color: #fff;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .card-price {
      color: #d4af37;
      font-size: clamp(1.5em, 4vw, 1.8em);
      font-weight: 600;
      margin-bottom: 20px;
    }

    .btn-order {
      background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
      color: #000;
      border: none;
      padding: 14px 30px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      font-size: clamp(0.9em, 2.5vw, 1em);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      min-height: 50px;
      touch-action: manipulation;
    }

    .btn-order:hover, .btn-order:active {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
    }

    .loading {
      text-align: center;
      color: #d4af37;
      font-size: 1.3em;
      grid-column: 1/-1;
      padding: 40px 20px;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      animation: fadeIn 0.3s;
      overflow-y: auto;
    }

    .modal-content {
      background: linear-gradient(145deg, #1a1a1a 0%, #2a2a2a 100%);
      margin: 5% auto;
      padding: 30px 20px;
      width: 95%;
      max-width: 500px;
      border-radius: 25px;
      position: relative;
      border: 2px solid rgba(212, 175, 55, 0.3);
      box-shadow: 0 25px 80px rgba(212, 175, 55, 0.2);
      animation: slideDown 0.4s ease-out;
    }

    @keyframes slideDown {
      from { transform: translateY(-100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .close {
      position: absolute;
      right: 20px;
      top: 15px;
      font-size: 32px;
      cursor: pointer;
      color: #d4af37;
      transition: all 0.3s;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .close:hover, .close:active {
      color: #fff;
      transform: rotate(90deg);
    }

    .modal h2 {
      font-family: 'Playfair Display', serif;
      color: #d4af37;
      margin-bottom: 20px;
      text-align: center;
      font-size: clamp(1.5em, 5vw, 2em);
      padding-right: 40px;
    }

    .item-info {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(244, 208, 63, 0.1) 100%);
      color: #fff;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-weight: 500;
      text-align: center;
      border: 1px solid rgba(212, 175, 55, 0.3);
      font-size: clamp(0.9em, 2.5vw, 1em);
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      font-size: 16px;
      background: rgba(255,255,255,0.05);
      color: #fff;
      transition: all 0.3s;
      min-height: 50px;
    }

    input:focus {
      outline: none;
      border-color: #d4af37;
      background: rgba(255,255,255,0.1);
    }

    input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    .btn-submit {
      background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
      color: #000;
      padding: 16px;
      border: none;
      border-radius: 12px;
      width: 100%;
      font-size: clamp(1em, 3vw, 1.1em);
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
      min-height: 55px;
      touch-action: manipulation;
    }

    .btn-submit:hover, .btn-submit:active {
      transform: scale(1.02);
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
    }

    /* Floating WhatsApp Button */
    .whatsapp-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #25D366;
      color: white;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
      cursor: pointer;
      transition: all 0.3s;
      z-index: 998;
      text-decoration: none;
      animation: pulse 2s infinite;
      touch-action: manipulation;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .whatsapp-float:hover, .whatsapp-float:active {
      transform: scale(1.15);
      box-shadow: 0 12px 35px rgba(37, 211, 102, 0.6);
    }

    /* Footer */
    footer {
      background: #0a0a0a;
      padding: 40px 20px;
      text-align: center;
      border-top: 2px solid rgba(212, 175, 55, 0.3);
      margin-top: 60px;
    }

    footer h3 {
      font-family: 'Playfair Display', serif;
      color: #d4af37;
      font-size: clamp(1.5em, 5vw, 2em);
      margin-bottom: 15px;
    }

    footer p {
      color: #aaa;
      margin: 8px 0;
      font-size: clamp(0.9em, 2.5vw, 1.1em);
    }

    .social-links {
      margin-top: 20px;
    }

    .social-links a {
      color: #d4af37;
      font-size: clamp(1.5em, 4vw, 2em);
      margin: 0 12px;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
      min-width: 44px;
      min-height: 44px;
      line-height: 44px;
      touch-action: manipulation;
    }

    .social-links a:hover, .social-links a:active {
      color: #fff;
      transform: translateY(-5px);
    }

    /* Mobile Optimizations */
    @media (max-width: 768px) {
      .hero {
        min-height: 90vh;
      }
      
      .grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      
      .card img {
        height: 250px;
      }
      
      .modal-content {
        margin: 10% auto;
        padding: 25px 15px;
      }
      
      .whatsapp-float {
        width: 55px;
        height: 55px;
        font-size: 28px;
        bottom: 15px;
        right: 15px;
      }
    }

    @media (max-width: 480px) {
      .hero h1 {
        font-size: 2.2em;
      }
      
      .hero-btn {
        padding: 14px 35px;
      }
      
      .products-section {
        padding: 40px 10px;
      }
      
      .card-body {
        padding: 20px 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Zashi Store</h1>
      <p>Discover Timeless Elegance in Every Piece</p>
      <a href="#products" class="hero-btn">Explore Collection</a>
    </div>
  </section>

  <!-- Products Section -->
  <section class="products-section" id="products">
    <h2 class="section-title">Our Luxury Collection</h2>
    <div class="grid" id="itemsContainer">
      <p class="loading"><i class="fas fa-spinner fa-spin"></i> Loading exquisite pieces...</p>
    </div>
  </section>

  <!-- Floating WhatsApp Button -->
  <a href="https://wa.me/923001234567" target="_blank" class="whatsapp-float">
    <i class="fab fa-whatsapp"></i>
  </a>

  <!-- Order Modal -->
  <div id="orderModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2>Complete Your Order</h2>
      <div class="item-info" id="modalItemInfo"></div>
      <input type="text" id="custName" placeholder="Your Name" required>
      <input type="text" id="custAddress" placeholder="Complete Address" required>
      <input type="tel" id="custPhone" placeholder="Mobile Number" required>
      <button class="btn-submit" onclick="sendToWhatsApp()">
        <i class="fab fa-whatsapp"></i> Order via WhatsApp
      </button>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <h3>Zashi Store</h3>
    <p>Crafting Elegance Since 2026</p>
    <p><i class="fas fa-phone"></i> +92 300 1234567</p>
    <p><i class="fas fa-envelope"></i> info@zashistore.com</p>
    <div class="social-links">
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-facebook"></i></a>
      <a href="https://wa.me/923001234567"><i class="fab fa-whatsapp"></i></a>
    </div>
    <p style="margin-top: 25px; color: #666;">&copy; 2026 Zashi Store. All Rights Reserved.</p>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    // ⚠️ YAHAN APNA FIREBASE CONFIG PASTE KAREIN
     const firebaseConfig = {
    apiKey: "AIzaSyBgjmBFNOLieDDQNtiKxaE_YK9JqnLgBhc",
    authDomain: "zashi-store.firebaseapp.com",
    projectId: "zashi-store",
    storageBucket: "zashi-store.firebasestorage.app",
    messagingSenderId: "1073727653000",
    appId: "1:1073727653000:web:57c717b6dd882541e9cb3d",
    measurementId: "G-9953FW8MTP"
  };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ⚠️ APNA WHATSAPP NUMBER YAHAN LIKHEIN (2 jagah)
    const whatsappNumber = "923001234567"; 
    let selectedItemName = "";
    let selectedItemPrice = "";

    // Firebase se items load karna
    db.collection("items").orderBy("timestamp", "desc").get().then((querySnapshot) => {
      const container = document.getElementById("itemsContainer");
      container.innerHTML = "";
      
      if (querySnapshot.empty) {
        container.innerHTML = "<p class='loading'>No items available yet. Check back soon!</p>";
        return;
      }

      querySnapshot.forEach((doc) => {
        const item = doc.data();
        const card = `
          <div class="card">
            <img src="${item.imageUrl}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">
            <div class="card-body">
              <div class="card-title">${item.name}</div>
              <div class="card-price">${item.price}</div>
              <button class="btn-order" onclick="openModal('${item.name}', '${item.price}')">
                <i class="fab fa-whatsapp"></i> Order Now
              </button>
            </div>
          </div>
        `;
        container.innerHTML += card;
      });
    }).catch((error) => {
      console.error("Error: ", error);
      document.getElementById("itemsContainer").innerHTML = "<p class='loading'>Error loading items. Please refresh.</p>";
    });

    // Modal Functions
    function openModal(name, price) {
      selectedItemName = name;
      selectedItemPrice = price;
      document.getElementById("modalItemInfo").innerHTML = `
        <i class="fas fa-gem"></i> ${name}<br>
        <strong>${price}</strong>
      `;
      document.getElementById("orderModal").style.display = "block";
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById("orderModal").style.display = "none";
      document.getElementById("custName").value = "";
      document.getElementById("custAddress").value = "";
      document.getElementById("custPhone").value = "";
      document.body.style.overflow = 'auto';
    }

    function sendToWhatsApp() {
      const name = document.getElementById("custName").value;
      const address = document.getElementById("custAddress").value;
      const phone = document.getElementById("custPhone").value;

      if (!name || !address || !phone) {
        alert("Please fill all details!");
        return;
      }

      const message = `✨ *NEW LUXURY ORDER*\n\n💎 *Item:* ${selectedItemName}\n💰 *Price:* ${selectedItemPrice}\n\n👤 *Customer:* ${name}\n📍 *Address:* ${address}\n📱 *Mobile:* ${phone}`;
      const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
      
      window.open(url, '_blank');
      closeModal();
    }

    window.onclick = function(event) {
      if (event.target == document.getElementById("orderModal")) closeModal();
    }

    // Smooth scroll
    document.querySelector('.hero-btn').addEventListener('click', function(e) {
      e.preventDefault();
      document.querySelector('#products').scrollIntoView({ behavior: 'smooth' });
    });
  </script>
</body>
</html>
