<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Zuki Jewelry</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 600px; margin: 50px auto; background: white; border-radius: 15px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    h2 { text-align: center; color: #333; margin-bottom: 30px; }
    input, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: 2px solid #ddd; font-size: 15px; }
    input:focus { outline: none; border-color: #667eea; }
    button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; font-weight: bold; cursor: pointer; font-size: 16px; transition: transform 0.2s; }
    button:hover { transform: scale(1.02); }
    .success { color: #25D366; text-align: center; display: none; font-weight: bold; margin-top: 15px; }
    #loginScreen { text-align: center; }
    #adminPanel { display: none; }
    .info { background: #f0f0f0; padding: 15px; border-radius: 8px; margin: 20px 0; font-size: 14px; line-height: 1.6; }
    .info a { color: #667eea; text-decoration: none; font-weight: bold; }
    .info a:hover { text-decoration: underline; }
    .view-btn { background: #25D366; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Screen -->
    <div id="loginScreen">
      <h2>🔒 Admin Login</h2>
      <input type="password" id="adminPass" placeholder="Enter Admin Password">
      <button onclick="checkLogin()">Login</button>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel">
      <h2>➕ Add New Jewelry Item</h2>
      
      <div class="info">
        <strong>📸 Image URL Kahan Se Milega?</strong><br>
        1. [Postimages.org](https://postimages.org/) par jayen<br>
        2. Apni jewelry ki photo upload karein<br>
        3. "Direct Link" copy karein<br>
        4. Niche "Image URL" mein paste karein
      </div>

      <input type="text" id="itemName" placeholder="Item Name (e.g., Gold Necklace)">
      <input type="text" id="itemPrice" placeholder="Price (e.g., Rs. 15,000)">
      <input type="text" id="itemImage" placeholder="Image URL (Paste from Postimages)">
      <button onclick="addItem()">✅ Add Item to Website</button>
      <p class="success" id="successMsg">✅ Item Successfully Added!</p>
      
      <button class="view-btn" onclick="window.open('index.html', '_blank')">👁️ View Live Website</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script>
    // ⚠️ YAHAN BHI WOH SAME FIREBASE CONFIG PASTE KAREIN
    const firebaseConfig = {
      apiKey: "AIzaSyDxxxxxxxxxxxxxxxxxxxx",
      authDomain: "jewelry-store-xxxxx.firebaseapp.com",
      projectId: "jewelry-store-xxxxx",
      storageBucket: "jewelry-store-xxxxx.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef123456"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ⚠️ APNA PASSWORD YAHAN SET KAREIN
    const ADMIN_PASSWORD = "Zuki@1122"; 

    function checkLogin() {
      if (document.getElementById("adminPass").value === ADMIN_PASSWORD) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
      } else {
        alert("❌ Galat Password!");
      }
    }

    function addItem() {
      const name = document.getElementById("itemName").value;
      const price = document.getElementById("itemPrice").value;
      const imageUrl = document.getElementById("itemImage").value;

      if (!name || !price || !imageUrl) {
        alert("⚠️ Sari fields fill karein!");
        return;
      }

      db.collection("items").add({
        name: name,
        price: price,
        imageUrl: imageUrl,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        document.getElementById("successMsg").style.display = "block";
        document.getElementById("itemName").value = "";
        document.getElementById("itemPrice").value = "";
        document.getElementById("itemImage").value = "";
        setTimeout(() => { document.getElementById("successMsg").style.display = "none"; }, 3000);
      }).catch((error) => {
        console.error("Error: ", error);
        alert("❌ Error adding item!");
      });
    }
  </script>
</body>
</html>
